<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
<title id="title">Illustrative paired swing gate clearance</title><desc id="desc">A 3.5 metre opening split into two approximately 1.75 metre leaves. Each leaf sweeps its own arc inside the driveway. No safety clearance or parking position is specified.</desc>
<rect width="720" height="340" rx="12" fill="#f0eee5"/><g font-family="Arial,sans-serif" fill="#193f30" text-anchor="middle"><text x="360" y="30" font-size="18">Plan view: 3.5 m clear opening example</text><text x="360" y="63" font-size="15">Road side</text><text x="360" y="316" font-size="15">Driveway side. Protective clearances are not shown.</text></g>
<g stroke="#193f30" fill="none"><path d="M40 105H180 M540 105H680" stroke-width="9"/><path d="M180 105H360 M360 105H540" stroke-width="7"/><path d="M360 105 A180 180 0 0 1 180 285 M360 105 A180 180 0 0 0 540 285" stroke-width="2" stroke-dasharray="8 6"/><path d="M180 105V285 M540 105V285" stroke-width="5" opacity=".5"/></g><g fill="#a66c24"><circle cx="180" cy="105" r="8"/><circle cx="540" cy="105" r="8"/></g><g fill="#193f30" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="270" y="89">~1.75 m leaf</text><text x="450" y="89">~1.75 m leaf</text><text x="360" y="245">Each arc follows its own hinge</text><text x="360" y="270">Not a construction drawing</text></g></svg>
