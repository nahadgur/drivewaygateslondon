<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-labelledby="title desc">
  <title id="title">Paired swing gates: opening and movement</title>
  <desc id="desc">Illustrative plan of a 3.5 metre opening with two approximately 1.75 metre leaves. Green horizontal lines show the gates closed; ochre vertical lines show them open inward at 90 degrees. Each dashed quarter-circle follows the free end of one leaf around its hinge. Fittings and protective clearances are omitted; this is not a construction drawing or a safe parking distance.</desc>
  <rect width="600" height="580" rx="16" fill="#f0eee5"/>
  <g font-family="Arial,sans-serif" fill="#193f30" text-anchor="middle">
    <text x="300" y="43" font-size="28" font-weight="700">Paired swing gates</text>
    <text x="300" y="77" font-size="22">Illustrative plan view</text>
    <text x="300" y="128" font-size="24" font-weight="700">3.5 m opening</text>
    <text x="300" y="178" font-size="22">ROAD SIDE</text>
    <text x="220" y="211" font-size="22">~1.75 m</text>
    <text x="380" y="211" font-size="22">~1.75 m</text>
    <text x="300" y="415" font-size="22">DRIVEWAY SIDE</text>
  </g>
  <g stroke="#617569" stroke-width="2" fill="none">
    <path d="M140 109V137 M460 109V137 M140 123H206 M394 123H460"/>
    <path d="M150 118L140 123L150 128 M450 118L460 123L450 128"/>
  </g>
  <!-- Each sector has its own hinge centre and a radius of 160 units. -->
  <g fill="#dce5db">
    <path d="M140 230H300 A160 160 0 0 1 140 390Z"/>
    <path d="M460 230H300 A160 160 0 0 0 460 390Z"/>
  </g>
  <path d="M35 230H129 M471 230H565" stroke="#8d968d" stroke-width="10"/>
  <g fill="none" stroke-linecap="round">
    <path d="M140 230H295 M305 230H460" stroke="#193f30" stroke-width="8"/>
    <path d="M140 230V390 M460 230V390" stroke="#9d641b" stroke-width="8"/>
    <path d="M300 230 A160 160 0 0 1 140 390 M300 230 A160 160 0 0 0 460 390" stroke="#193f30" stroke-width="2.5" stroke-dasharray="7 7"/>
  </g>
  <g fill="#fffdf7" stroke="#193f30" stroke-width="3">
    <circle cx="140" cy="230" r="9"/>
    <circle cx="460" cy="230" r="9"/>
  </g>
  <path d="M40 437H560" stroke="#cdd2c8"/>
  <g font-family="Arial,sans-serif" font-size="23" fill="#193f30">
    <path d="M70 463H126" stroke="#193f30" stroke-width="8" stroke-linecap="round"/>
    <text x="150" y="471">Gates closed</text>
    <path d="M70 503H126" stroke="#9d641b" stroke-width="8" stroke-linecap="round"/>
    <text x="150" y="511">Gates open inward at 90°</text>
    <path d="M70 543H126" stroke="#193f30" stroke-width="2.5" stroke-dasharray="7 7"/>
    <text x="150" y="551">Path of each leaf’s free end</text>
  </g>
</svg>
